{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Удаление игры</h2>
    <p>Вы уверены, что хотите удалить игру "{{ object.title }}"?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'catalog:game_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
