{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Удаление отзыва</h2>
    <p>Вы уверены, что хотите удалить ваш отзыв на игру "{{ object.game.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'catalog:game_detail' object.game.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
