{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Вход</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary mt-3">Войти</button>
            <a href="{% url 'register' %}" class="btn btn-link">Регистрация</a>
        </form>
    </div>
</div>
{% endblock %}
